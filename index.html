        <div class="flow-projections"><div><small>全局坐标 · 水平 / 竖直</small><strong class="flow-global"></strong><span class="formula">Fx = D cosβ − L sinβ<br>Fz = D sinβ + L cosβ</span></div><div><small>截面体轴 · 随截面转动</small><strong class="flow-body"></strong><span class="formula">Fxᵦ = D cosα − L sinα<br>Fzᵦ = D sinα + L cosα</span></div></div>
      </div><aside class="controls">
        <h3>把风向与截面方向分开看</h3><p class="muted">先转风，再转截面。注意 D、L 沿风轴定义，而水平力、竖向力取决于坐标投影。</p>
        <div class="range-row"><label for="${uid}-u">平均风速 U</label><span class="flow-u-value"></span><input id="${uid}-u" data-key="u" type="range" min="10" max="60" step="1" value="30"></div>
        <div class="range-row"><label for="${uid}-beta">平均风向 β</label><span class="flow-beta-value"></span><input id="${uid}-beta" data-key="beta" type="range" min="-20" max="20" step="1" value="0"></div>
        <div class="range-row"><label for="${uid}-theta">截面顺时针角 θ</label><span class="flow-theta-value"></span><input id="${uid}-theta" data-key="theta" type="range" min="-15" max="15" step="1" value="0"></div>
        <div class="readouts"><div class="readout"><small>相对攻角 α</small><strong class="flow-alpha"></strong></div><div class="readout"><small>平均动压 q</small><strong class="flow-q"></strong></div></div>
        <div style="margin:10px 0 18px"><div style="height:9px;background:#e7edf2;border-radius:6px;overflow:hidden"><div class="flow-pressure-bar" style="height:100%;background:#2675b5;width:25%;transition:width .12s"></div></div><p class="flow-note flow-pressure-ratio" style="margin-top:8px"></p></div>
        <div class="explain"><b>这里先固定系数，只研究坐标</b><p>教学示例：B = 10 m，H = 2 m，ρ = 1.225 kg/m³；Cd = 0.90，Cl = 0.25，Cm = 0。所有荷载均按桥梁纵向每延米计算。</p><p class="formula">q = ½ρU²<br>D = qH Cd；L = qB Cl<br>M = qB² Cm</p><div class="flow-forces"></div></div>
        <p class="flow-note">下一页再让系数随攻角变化；本页固定系数是为了单独看清投影。正升力沿风向逆时针旋转 90°，正力矩取顺时针。</p>
        <button class="btn flow-reset" type="button">恢复水平风与水平截面</button>
        <div class="flow-task"><b>课堂试一试</b><br>保持 U 不变，只改变 θ。D、L 不变，体轴分量会变；然后将 U 从 30 提到 60 m/s，动压和荷载增至 4 倍。</div>
      </aside></div>`;
      const state = {u:30,beta:0,theta:0};
      const $ = s => host.querySelector(s);
      function render() {
        const {u,beta,theta}=state, b=rad(beta), a=rad(beta+theta), q=.5*1.225*u*u;
        const D=q*2*.9,L=q*10*.25,Fx=D*Math.cos(b)-L*Math.sin(b),Fz=D*Math.sin(b)+L*Math.cos(b);
        const Fxb=D*Math.cos(a)-L*Math.sin(a),Fzb=D*Math.sin(a)+L*Math.cos(a),R=Math.hypot(D,L),fs=145/R;
        const cx=388,cy=246, vx=200*Math.cos(b),vy=-200*Math.sin(b);
        const defs=[['blue','#2675b5'],['green','#16866c'],['amber','#c47e24'],['gray','#9baab8']].map(([n,c])=>`<marker id="${uid}-${n}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="${c}"/></marker>`).join('');
        const arc = (r,start,end) => {const t1=rad(start),t2=rad(end),p1=[cx+r*Math.cos(t1),cy+r*Math.sin(t1)],p2=[cx+r*Math.cos(t2),cy+r*Math.sin(t2)];return `<path d="M${p1} A${r} ${r} 0 0 ${end>start?1:0} ${p2}" fill="none" stroke="#ba7830" stroke-width="2"/>`;};
        $('.flow-scene').innerHTML=`<defs>${defs}</defs>
          <text x="27" y="34" style="font-size:18px;font-weight:700">平均风向与截面角，各有一个零点</text>
          <g opacity=".7">${arrow(75,130,280,130,'#9baab8',uid+'-gray','5 5')}${arrow(75,130,75,45,'#9baab8',uid+'-gray','5 5')}</g>
          ${arrow(75,130,75+vx,130+vy,'#2675b5',uid+'-blue')}
          <path d="M${75+vx} ${130+vy} V130 H75" fill="none" stroke="#9baab8" stroke-dasharray="5 5"/>
          <text x="90" y="105">U = ${u} m/s；β = ${beta}°</text>
          <text x="85" y="158">Ux = ${fmt(u*Math.cos(b),1)} m/s</text>
          <text x="85" y="181">Uz = ${fmt(u*Math.sin(b),1)} m/s</text>
          <text x="42" y="342" style="font-size:13px;fill:#64778b">虚线：全局水平与竖直</text>
          <line x1="215" y1="${cy}" x2="650" y2="${cy}" stroke="#b5c2ce" stroke-dasharray="5 5"/><line x1="${cx}" y1="65" x2="${cx}" y2="370" stroke="#b5c2ce" stroke-dasharray="5 5"/>
          <text x="653" y="250">x</text><text x="395" y="66">z</text>
          <g transform="translate(${cx} ${cy}) rotate(${theta})"><rect x="-115" y="-23" width="230" height="46" rx="4" fill="#e1e9ef" stroke="#62798e" stroke-width="2"/>${arrow(0,0,175,0,'#c47e24',uid+'-amber')}${arrow(0,0,0,-136,'#c47e24',uid+'-amber')}<text x="178" y="21" style="fill:#9d631a">xᵦ</text><text x="-24" y="-140" style="fill:#9d631a">zᵦ</text></g>
          <g transform="translate(${cx} ${cy}) rotate(${-beta})">${arrow(0,0,D*fs,0,'#2675b5',uid+'-blue')}${arrow(0,0,0,-L*fs,'#2675b5',uid+'-blue')}<text x="${D*fs+9}" y="-10" style="fill:#2675b5;font-weight:700">D</text><text x="12" y="${-L*fs+4}" style="fill:#2675b5;font-weight:700">L</text></g>
          ${arrow(cx,cy,cx+Fx*fs,cy-Fz*fs,'#16866c',uid+'-green')}<text x="${cx+Fx*fs+10}" y="${cy-Fz*fs-7}" style="fill:#16866c;font-weight:700">R</text>
          ${Math.abs(beta+theta)>.2?arc(65,-beta,theta):''}
          <circle cx="${cx}" cy="${cy}" r="5" fill="#26394d"/><text x="385" y="350" style="font-size:19px;font-weight:700">α = ${beta}° + (${theta}°) = ${beta+theta}°</text>
          <text x="27" y="401" style="font-size:13px;fill:#64778b">力箭头采用同一比例；随当前荷载量级自动缩放。M = 0，不绘力矩箭头。</text>`;
        $('.flow-u-value').textContent=u+' m/s';$('.flow-beta-value').textContent=beta+'°';$('.flow-theta-value').textContent=theta+'°';
        $('.flow-alpha').textContent=(beta+theta)+'°';$('.flow-q').textContent=fmt(q,1)+' Pa';
        $('.flow-pressure-bar').style.width=(u*u/3600*100)+'%';
        $('.flow-pressure-ratio').textContent=`以 30 m/s 为参照：风速 ${fmt(u/30)} 倍 → 动压、D、L 均为 ${fmt((u/30)**2)} 倍。`;
        $('.flow-global').textContent=`Fx ${fmt(Fx/1000)} / Fz ${fmt(Fz/1000)} kN/m`;
        $('.flow-body').textContent=`Fxᵦ ${fmt(Fxb/1000)} / Fzᵦ ${fmt(Fzb/1000)} kN/m`;
        $('.flow-forces').textContent=`D = ${fmt(D/1000)} kN/m；L = ${fmt(L/1000)} kN/m；M = 0 kN·m/m`;
      }
      host.querySelectorAll('input[data-key]').forEach(input=>input.addEventListener('input',()=>{state[input.dataset.key]=Number(input.value);render();}));
      $('.flow-reset').addEventListener('click',()=>{state.u=30;state.beta=0;state.theta=0;host.querySelectorAll('input[data-key]').forEach(i=>i.value=state[i.dataset.key]);render();});
      render();return {resize(){}};
    }
  };
})();

</script>
<script>
/* sections.js */
/* Cross-section geometry, clearly labeled teaching coefficients and archived data. */
(() => {
  'use strict';
  const C = {blue:'#2775b6',green:'#16866c',amber:'#c47e24',red:'#c65453'};
  const f=(x,d=3)=>Math.abs(x)<Math.pow(10,-d)/2?(0).toFixed(d):x.toFixed(d);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rad=a=>a*Math.PI/180;
  function demo(r,a) {let t=rad(a);return {Cd:r===1?1.8+.8*Math.sin(t)**2:.9+1.6*Math.sin(t)**2,Cl:(r===1?2.8:4.2)*t,Cm:(r===1?.08:.45)*t};}
  window.SectionsLab = {
    mount(host) {
      const uid='sections'+Math.random().toString(36).slice(2,8),src=window.StaticWindSource;
      const state={mode:'geometry',ratio:5,alpha:3,u:30,col:'FXCoeff',aoacol:1};
      host.innerHTML=`<style>
        .sections-lab svg{display:block;width:100%;height:auto}.sections-lab svg text{font-family:inherit;fill:#34485c;font-size:13px}.sections-lab .sections-nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.sections-lab .sections-nav .btn{font-size:13px;padding:9px 12px}.sections-lab button[aria-pressed=true]{background:#e7f2f8;border-color:#2475a7;color:#14577c}.sections-lab .sections-choices{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.sections-lab .sections-note{font-size:13px;line-height:1.75;color:#55687b}.sections-lab .sections-stats{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}.sections-lab .sections-stats td,.sections-lab .sections-stats th{padding:10px 8px;border-bottom:1px solid #e2e8ef;text-align:right}.sections-lab .sections-stats td:first-child,.sections-lab .sections-stats th:first-child{text-align:left}.sections-lab .sections-table-wrap{overflow-x:auto}.sections-lab .sections-selected{background:#eef6f9}.sections-lab .sections-task{padding:13px 15px;background:#eef7f3;border-radius:12px;margin-top:14px;font-size:14px;line-height:1.75}.sections-lab .sections-legend{display:flex;gap:20px;font-size:13px;margin:0 0 10px;flex-wrap:wrap}.sections-lab .sections-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.sections-lab details{font-size:13px;line-height:1.7;margin-top:12px}.sections-lab details summary{cursor:pointer;color:#46647a}.sections-lab [hidden]{display:none!important}.sections-lab .sections-result{padding:13px 0;font-size:15px;line-height:1.9}.sections-lab input{accent-color:#2475a7}.sections-lab .sections-source{font-size:12px;overflow-wrap:anywhere;color:#66798b}@media(max-width:650px){.sections-lab .sections-nav .btn{flex:1;min-width:95px}.sections-lab .sections-stats{font-size:12px}.sections-lab .sections-stats td,.sections-lab .sections-stats th{padding:8px 4px}}
        .sections-lab .stage{min-width:0;container-type:inline-size}.sections-lab .sections-svg-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.sections-lab .sections-svg-scroll svg{min-width:620px}.sections-lab .sections-svg-scroll:focus-visible{outline:2px solid #2675b5;outline-offset:4px}.sections-lab .sections-scroll-hint{display:none;font-size:13px;color:#46647a;margin:10px 0 6px}@container(max-width:619px){.sections-lab .sections-scroll-hint{display:block}}
      </style><div class="sections-lab lab-grid"><div class="stage">
        <div class="sections-nav" role="group" aria-label="截面教学视图"><button class="btn" data-mode="geometry" aria-pressed="true">① 迎风与三分力</button><button class="btn" data-mode="history" aria-pressed="false">② 原始时程对比</button><button class="btn" data-mode="aoa" aria-pressed="false">③ 原脚本攻角表</button></div>
        <p class="sections-scroll-hint">↔ 图示保持可读字号，可左右滑动查看；键盘聚焦后可用方向键。</p><div class="sections-content"></div>
      </div><aside class="controls">
        <div class="sections-geometry-controls"><h3>同样的风，截面怎样受力？</h3><p class="muted">橙色边表示朝向来流的表面；虚线表示背风侧尾流位置。先认方向，再看三分力。</p>
          <label>截面宽高比 B/H</label><div class="sections-choices" role="group" aria-label="截面宽高比"><button type="button" class="btn" data-ratio="1" aria-pressed="false">1 : 1 · 方形</button><button type="button" class="btn" data-ratio="5" aria-pressed="true">5 : 1 · 扁矩形</button></div>
          <div class="range-row"><label for="${uid}-alpha">平均来流攻角 α</label><span class="sections-alpha-value"></span><input id="${uid}-alpha" data-key="alpha" type="range" min="-10" max="10" step=".5" value="3"></div>
          <div class="range-row"><label for="${uid}-u">平均风速 U</label><span class="sections-u-value"></span><input id="${uid}-u" data-key="u" type="range" min="10" max="60" step="1" value="30"></div>
          <div class="readouts"><div class="readout"><small>平均动压 q</small><strong class="sections-q"></strong></div><div class="readout"><small>尺寸 B × H</small><strong class="sections-size"></strong></div></div>
          <div class="explain"><b>明示本页教学定义</b><p class="formula">Cd = D/(qH)<br>Cl = L/(qB)<br>Cm = M/(qB²)</p><p>D、L 沿风轴；M 顺时针为正。D、L 为 N/m，M 为 N·m/m，均按桥梁纵向每延米。ρ = 1.225 kg/m³。</p><div class="sections-result"></div></div>
          <details><summary>展开：示意系数如何生成</summary><p>α 以弧度代入。1:1：Cd = 1.8 + 0.8 sin²α，Cl = 2.8α，Cm = 0.08α。5:1：Cd = 0.9 + 1.6 sin²α，Cl = 4.2α，Cm = 0.45α。</p><p>这些是为课堂生成的对称示意模型，未从原时程或攻角表拟合，不是实验值、CFD 或工程设计参数。箭头方向与数值按这些定义计算。</p></details>
          <div class="sections-task"><b>课堂试一试</b><br>把 α 从 +3° 改成 −3°：本示意模型中 L、M 换向，D 保持相同。观察迎风侧上下表面怎样互换。</div>
        </div>
        <div class="sections-history-controls" hidden><h3>先比较同名原始列</h3><p class="muted">同一时间窗、同一纵轴，把均值与脉动幅值分开看。</p><label>选择原始数据列</label><div class="sections-choices" role="group" aria-label="原始数据列"><button class="btn" data-col="FXCoeff" aria-pressed="true">FXCoeff</button><button class="btn" data-col="FYCoeff" aria-pressed="false">FYCoeff</button><button class="btn" data-col="MCoeff" aria-pressed="false">MCoeff</button></div><div class="explain"><b>保留数据自己的名字</b><p>文件名标明 1:1 与 5:1；表头仅给出 time、Wind、FXCoeff、FYCoeff、MCoeff。</p><p>轴向、参考长度与归一化基准尚未确认，因此这里保留原列名，不直接认定为 Cd、Cl、Cm，也不据此换算实际风荷载。</p></div><details><summary>统计与显示方法</summary><p>统计采用共同时间窗内全部原始样本的算术均值。脉动 RMS = √mean[(C − C̄)²]，用于比较相对各自均值的起伏，不是 √mean(C²)。未作时间加权。</p><p>为离线流畅显示，图线按等时分箱保留极小值与极大值，统计仍使用全部样本。两文件采样时刻和样本数不同。</p></details><div class="sections-task"><b>课堂试一试</b><br>切换 FYCoeff，先看两条均值虚线，再看各自起伏。均值接近零，不代表这一列始终接近零。</div></div>
        <div class="sections-aoa-controls" hidden><h3>这 5 个点实际告诉了什么？</h3><p class="muted">来自原 MATLAB 脚本的给定表，不随本页 B/H 按钮变化。</p><label>查看系数</label><div class="sections-choices" role="group" aria-label="攻角表系数"><button class="btn" data-aoacol="1" aria-pressed="true">Cd</button><button class="btn" data-aoacol="2" aria-pressed="false">Cl</button><button class="btn" data-aoacol="3" aria-pressed="false">Cm</button></div><div class="explain"><b>数据事实与解释范围</b><p>原表给出了 α = −10°、−3°、0°、3°、10° 的 Cd、Cl、Cm，以及三列标注为导数的数据。</p><p>脚本没有交代该表对应的截面、归一化基准及导数来源。因此不能把它擅自对应到 1:1 或 5:1，也不能只凭这些值断言某截面的发散临界风速。</p></div><p class="sections-note">图中线段仅连接给定点，不表示已知的精确连续曲线。导数原值完整保留在离线数据文件中；本页不把离散连线斜率当作原表导数。</p><div class="sections-task"><b>课堂试一试</b><br>切换 Cm，比较 +3° 到 +10° 与 −3° 到 0° 的变化方向。讨论“系数正负”和“曲线局部斜率正负”为什么是两件事。</div></div>
      </aside></div>`;
      const $=s=>host.querySelector(s);
      function geometry() {
        const {ratio:r,alpha:a,u}=state,t=rad(a),B=2*r,H=2,q=.5*1.225*u*u,co=demo(r,a),D=q*H*co.Cd,L=q*B*co.Cl,M=q*B*B*co.Cm;
        const cx=350,cy=230,w=r===1?145:310,h=w/r,x=cx-w/2,y=cy-h/2,fx=D*Math.cos(t)-L*Math.sin(t),fz=D*Math.sin(t)+L*Math.cos(t),s=105/Math.max(D,Math.abs(L),1);
        const markers=Object.entries(C).map(([k,c])=>`<marker id="${uid}-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="${c}"/></marker>`).join('');
        const arrow=(x1,y1,x2,y2,k,sw=3)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C[k]}" stroke-width="${sw}" marker-end="url(#${uid}-${k})"/>`;
        let wind=''; for(let j=0;j<3;j++){let yy=cy+(j-1)*45;wind+=arrow(35,yy,130,yy,'blue',2);}
        let wake='';for(let j=-2;j<=2;j++){const xx=x+w+5,yy=cy+j*h/6;wake+=`<path d="M${xx} ${yy} Q${xx+65} ${yy+j*15} ${xx+130} ${yy+j*22}" fill="none" stroke="#a2b4c4" stroke-width="1.5" stroke-dasharray="5 5"/>`;}
        const lift=Math.abs(L)>1?arrow(0,0,0,-L*s,'green')+'<text x="12" y="'+(-L*s+(L>0?-5:18))+'" style="fill:'+C.green+';font-weight:700">L '+(L>0?'+':'−')+'</text>':'';
        const moment=Math.abs(M)>1?`<path d="${M>0?'M-28 -27 A38 38 0 1 1 -36 17':'M-36 17 A38 38 0 1 0 -28 -27'}" fill="none" stroke="${C.red}" stroke-width="3" marker-end="url(#${uid}-red)"/><text x="-59" y="63" style="fill:${C.red};font-weight:700">M ${M>0?'+':'−'}</text>`:'';
        $('.sections-content').innerHTML=`<div class="sections-legend"><span><i class="sections-dot" style="background:${C.amber}"></i>迎风表面</span><span><i class="sections-dot" style="background:${C.blue}"></i>D 阻力</span><span><i class="sections-dot" style="background:${C.green}"></i>L 升力</span><span><i class="sections-dot" style="background:${C.red}"></i>M 力矩</span></div><svg viewBox="0 0 700 455" role="img" aria-label="${r} 比 1 矩形截面在 ${a} 度攻角下的平均三分力示意"><defs>${markers}</defs>
          <text x="25" y="34" style="font-weight:700;font-size:18px">B/H = ${r}:1 · ${a>0?'来流向上倾斜':a<0?'来流向下倾斜':'水平来流'}</text>
          <g transform="rotate(${-a} ${cx} ${cy})">${wind}${wake}<text x="42" y="${cy-75}" style="fill:${C.blue}">平均来流 U</text><text x="${x+w+35}" y="${cy+h/2+69}" style="fill:#73879a">背风尾流区</text></g>
          <line x1="190" y1="${cy}" x2="635" y2="${cy}" stroke="#d5dfe7" stroke-dasharray="4 5"/>
          <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#e0e8ef" stroke="#5d768b" stroke-width="2"/>
          <line x1="${x}" y1="${y}" x2="${x}" y2="${y+h}" stroke="${C.amber}" stroke-width="6"/>
          ${Math.abs(a)>.01?`<line x1="${x}" y1="${a>0?y+h:y}" x2="${x+w}" y2="${a>0?y+h:y}" stroke="${C.amber}" stroke-width="6"/>`:''}
          <g transform="translate(${cx} ${cy}) rotate(${-a})">${arrow(0,0,D*s,0,'blue')}<text x="${D*s+10}" y="-8" style="fill:${C.blue};font-weight:700">D +</text>${lift}</g><g transform="translate(${cx-85} ${cy-h/2-62})">${moment}</g>
          <circle cx="${cx}" cy="${cy}" r="4" fill="#26394d"/>

    const svg = host.querySelector('.loads-svg');

    function integrate() {

      let moment = 0;

        const z = Z_MIN + i * dz;
        const weight = (i === 0 || i === n) ? 0.5 : 1;
        force += weight * load(z) * dz;
        moment += weight * load(z) * z * dz;
      }
      return { force, moment, center: moment / force };
    }

        const color = s.status === 'unstable' ? C.unstable : C.stable;
        html += `<circle cx="${a.x(deg(s.equilibrium))}" cy="${a.y(elastic(s.equilibrium))}" r="7" fill="${color}" stroke="white" stroke-width="2"/>`;
      }
      html += `</g>${outOfBounds(a)}<rect x="${a.r-250}" y="${a.t+5}" width="246" height="46" rx="5" fill="#fbfdff" opacity=".92"/><text x="${a.r-10}" y="${a.t+23}" text-anchor="end" style="fill:${C.aero}">Q a = ${fmt(s.Q*s.slope/1000,2)} kN·m/rad</text><text x="${a.r-10}" y="${a.t+45}" text-anchor="end" style="fill:${C.structure}">k = ${fmt(s.k/1000,2)} kN·m/rad</text>`;
      svg.innerHTML = html;
      svg.setAttribute('aria-label', '固定当前风速的平均气动力矩和结构抵抗力矩两条直线，绿色交点稳定，红色交点不稳定；没有交点时不画点。');
      const inWindow = Math.abs(s.theta) <= LIMIT + 1e-10;
      legend.innerHTML = key(inWindow ? `Mₐ = ${fmt(aero(s.theta),2)} kN·m` : '气动力矩 Mₐ = Q(Cₘ₀ + aθ)', C.aero) + key(inWindow ? `kθ = ${fmt(elastic(s.theta),2)} kN·m` : '结构抵抗力矩 kθ', C.structure) + key('稳定交点', C.stable) + key('不稳定交点', C.unstable);
      let conclusion;
      if (s.status === 'critical') {
        conclusion = s.continuum ? '两线重合：线性模型中的任意小角都满足平衡，一阶恢复刚度为零。' : '两线平行且不重合：此线性模型没有平衡根，不画交点。';
      } else if (s.equilibrium !== null && Math.abs(s.equilibrium) <= LIMIT + 1e-10) {
        conclusion = `交点 θₑ = ${fmt(deg(s.equilibrium),2)}°；${s.status === 'stable' ? '结构斜率较大，小扰动产生恢复净矩。' : '气动斜率较大，小扰动产生同向净矩。'}`;
      } else if (s.equilibrium !== null) {
        conclusion = `线性方程的根 θₑ = ${fmt(deg(s.equilibrium),1)}° 在 ±10° 工作区外，图内没有交点；大角度行为需重新评估系数。`;
      } else conclusion = '本状态未提供有限平衡根，因此不画交点。';
      caption.innerHTML = `<strong>${conclusion}</strong> ${inWindow ? `竖线：当前 θ = ${fmt(deg(s.theta),1)}°。` : ''}求值与斜率比较都用 rad；kθ 是平衡式右侧的抵抗力矩量值，实际弹性恢复力矩为 −kθ。`;
    }

    function disposeGroup(group) {
      group.traverse(obj => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) (Array.isArray(obj.material) ? obj.material : [obj.material]).forEach(m => m.dispose());
      });
      group.clear();
    }

    // Split at the singular wind speed and at exact work-window crossings.
    // Sampling each interval separately also handles arbitrarily small Cₘ₀.
    function equilibriumSegments(s) {
      const breaks = [0, UMAX];
      if (s.criticalSpeed > 0 && s.criticalSpeed < UMAX) breaks.push(s.criticalSpeed);
      for (const theta of [-LIMIT, LIMIT]) {
        const denominator = s.factor * (s.C0 + s.slope * theta);
        const square = s.k * theta / denominator;
        if (square > 0 && Number.isFinite(square)) {
          const speed = Math.sqrt(square);
          if (speed > 0 && speed < UMAX) breaks.push(speed);
        }
      }
      const ordered = breaks.sort((a,b) => a-b).filter((n,i,a) => i === 0 || n-a[i-1] > 1e-9);
      const result = [];
      const rootAt = U => {
        if (s.zeroBias) return 0;
        const Q = s.factor * U ** 2, effective = s.k - Q * s.slope;
        return Math.abs(effective) > s.k * 1e-12 ? Q * s.C0 / effective : null;
      };
      for (let i=0; i<ordered.length-1; i++) {
        const low=ordered[i], high=ordered[i+1], mid=(low+high)/2, midRoot=rootAt(mid);
        if (midRoot === null || Math.abs(midRoot) > LIMIT + 1e-10) continue;
        const stability = s.k - s.factor * mid ** 2 * s.slope > 0 ? 'stable' : 'unstable';
        const points=[];
        for (let j=0; j<=80; j++) {
          const U=low+(high-low)*j/80, theta=rootAt(U);
          if (theta !== null && Number.isFinite(theta) && Math.abs(theta) <= LIMIT + 1e-9) points.push({U,theta,M:s.k*theta});
        }
        if (points.length > 1) result.push({low,high,stability,points});
      }
      return result;
    }

    function equilibriumText() {
      const s=state;
      if(s.status==='critical') return s.continuum ? '当前恰在临界且常量风矩为零：两面沿整条 θ 方向相交，工作窗内任意 θ 均为中性平衡。' : '当前恰在临界且 Cₘ₀ ≠ 0：两面同斜率却有常量差，此一阶模型无有限平衡根。';
      if(Math.abs(s.equilibrium)>LIMIT) return `当前代数根 θₑ = ${fmt(deg(s.equilibrium),2)}° 在 ±10° 工作窗外；保留这个数值，图内不造交点。`;
      return `当前 U = ${fmt(s.U,2)} m/s，θₑ = ${fmt(deg(s.equilibrium),2)}°，${s.status==='stable'?'交点稳定':'交点不稳定'}。`;
    }

    function renderStepCopy() {
      const s=state;
      const descriptions=[
        ['先让每一组 (U, θ) 对应一个气动力矩高度', '由 Cₘ = Mₐ/(qB²ℓ) 的定义，把无量纲系数还原为力矩。B²ℓ 是参考尺度，真实压力合力与作用点包含在 Cₘ 里。固定 α₀ = 0 时 α = θ，再保留 Cₘ 的一阶项。', '<span class="tp-aero">Mₐ(U,θ) = ½ρU²B²ℓ(Cₘ₀ + aθ)</span><br>Q(U) = ½ρU²B²ℓ'],
        ['叠上结构抵抗力矩：它沿风速 U 方向保持不变', '蓝面只有 θ 改变时才升降。平衡式右侧用 R = kθ；真实作用在桥面上的结构恢复力矩是 −kθ。', '<span class="tp-structure">R(θ) = kθ</span><br><span class="tp-aero">Mₐ</span> + <span class="tp-structure">(−kθ)</span> = N'],
        ['同一 (U, θ) 上，两面一样高才是平衡', '逐个风速找橙面与蓝面的等高点，连起来就是两面的交线。交点存在和交点稳定，需要分别判断。', '<span class="tp-aero">Q(Cₘ₀+aθₑ)</span> = <span class="tp-structure">kθₑ</span><br>(<span class="tp-structure">k</span> − <span class="tp-aero">Qa</span>)θₑ = <span class="tp-aero">QCₘ₀</span>'],
        ['沿 M 方向落到底面，只留下风速与转角', '紫色虚线从真实交线垂直落到底面；U 和 θ 都不变。下图把同一底面展开，绿色稳定、红色不稳定。底面只承载 U–θ 坐标，所处高度用于排图，不表示 M = 0。', '(<span class="tp-projection">U, θₑ</span>, M) → (<span class="tp-projection">U, θₑ</span>)<br>θₑ(U) = QCₘ₀ / (k − Qa)<br><small>仅限 k − Qa ≠ 0；临界时回到原平衡式。</small>'],
        ['固定当前 U，一刀切出两条力矩直线', '青色平面垂直于 U 轴。它分别切橙面和蓝面，得到同一风速下的 Mₐ–θ 与 R–θ 两条直线；交点垂直投影到下图当前 U 的竖线上。', `<span class="tp-aero">Mₐ(θ) = ${fmt(s.Q/1000,2)}(Cₘ₀+aθ)</span><br><span class="tp-structure">R(θ) = ${fmt(s.k/1000,2)}θ</span>　[kN·m]`]
      ];
      const [title,body,equation]=descriptions[lessonStep];
      stepCopy.innerHTML=`<div><strong>${title}</strong><p>${body}</p></div><div class="tp-equation">${equation}</div>`;
      stepButtons.forEach((button,i)=>button.setAttribute('aria-pressed',String(i===lessonStep)));
    }

    function renderBranch() {
      const s=state,l=74,r=746,t=36,b=224;
      const x=U=>l+U/UMAX*(r-l), y=theta=>b-(theta/LIMIT+1)/2*(b-t);
      let html=`<defs><clipPath id="${id}-branch"><rect x="${l}" y="${t}" width="${r-l}" height="${b-t}"/></clipPath></defs><text x="${l}" y="21">θₑ / ° · 局部工作窗</text>`;
      for(const angle of [-10,-5,0,5,10]) html+=`<path d="M${l} ${y(rad(angle))}H${r}" stroke="${angle===0?'#acbfcd':C.grid}"/><text x="${l-12}" y="${y(rad(angle))+5}" text-anchor="end">${angle}°</text>`;
      for(const U of [0,20,40,60,85]) html+=`<path d="M${x(U)} ${t}V${b}" stroke="${C.grid}"/><text x="${x(U)}" y="${b+23}" text-anchor="middle">${U}</text>`;
      html+=`<g clip-path="url(#${id}-branch)">`;
      if(s.criticalSpeed!==null && s.criticalSpeed<=UMAX) {
        html+=`<path data-tp-critical-line="${s.zeroBias?'equilibrium':'asymptote'}" d="M${x(s.criticalSpeed)} ${t}V${b}" stroke="${C.critical}" stroke-width="${s.zeroBias?3:1.5}" ${s.zeroBias?'':'stroke-dasharray="6 5"'}/>`;
      }
      for(const segment of equilibriumSegments(s)) {
        const path=segment.points.map((p,i)=>`${i?'L':'M'}${x(p.U)},${y(p.theta)}`).join(' ');
        html+=`<path data-tp-branch="${segment.stability}" data-u-low="${segment.low}" data-u-high="${segment.high}" d="${path}" fill="none" stroke="${C[segment.stability]}" stroke-width="3.2"/>`;
      }
      html+=`<path data-tp-current-u="${s.U}" d="M${x(s.U)} ${t}V${b}" stroke="#45918e" stroke-width="1.8" stroke-dasharray="4 4"/>`;
      if(s.equilibrium!==null && Math.abs(s.equilibrium)<=LIMIT+1e-10) html+=`<circle data-tp-equilibrium="${s.equilibrium}" cx="${x(s.U)}" cy="${y(s.equilibrium)}" r="6.5" fill="${C[s.status]}" stroke="white" stroke-width="2"/>`;
      if(s.continuum) html+=`<path data-tp-current-neutral="true" d="M${x(s.U)} ${t}V${b}" stroke="${C.critical}" stroke-width="4"/>`;
      html+=`</g><rect x="${l}" y="${t}" width="${r-l}" height="${b-t}" fill="none" stroke="#cfdee9"/><text x="${r}" y="274" text-anchor="end">平均风速 U / (m/s)</text>`;
      html+=`<text x="${l+8}" y="${t+18}" style="fill:#3e7f7a">当前 U = ${fmt(s.U,2)} m/s</text>`;
      branchSVG.innerHTML=html;
      branchSVG.setAttribute('aria-label','两曲面交线在风速与转角平面的投影。横轴风速零至八十五米每秒，纵轴转角负十度至正十度。绿色分支稳定，红色分支不稳定，青色竖线表示当前风速；金色实竖线表示零偏置临界时的一整条中性平衡。');
      branchLegend.innerHTML=key('稳定：k − Qa > 0',C.stable)+key('不稳定：k − Qa < 0',C.unstable)+key(s.zeroBias?'临界中性平衡：k − Qa = 0':'临界 U：无有限根',C.critical)+key('当前 U','#45918e');
      let special='';
      if(s.criticalSpeed!==null&&s.criticalSpeed<=UMAX) special=s.zeroBias?' Cₘ₀ = 0 时，θₑ = 0 横线始终保留；临界处还多出一整条竖直平衡线。':' 金色虚线是线性临界风速；非零 Cₘ₀ 时这里无有限根，两侧分支在此断开。';
      else special=s.slope<=0?' a ≤ 0：本模型在正风速下无发散临界，平衡分支保持静力稳定。':' 线性临界风速在当前 0～85 m/s 图窗之外。';
      branchNote.innerHTML=`<strong>${equilibriumText()}</strong>${special} 根在窗外与方程无根是两种情况；这里不把窗外根夹到 ±10°。`;
    }

    function initialize3D() {
      if (three || failed3D) return !!three;
      const T = window.THREE;
      if (!T) { failed3D = true; return false; }
      try {
        const renderer = new T.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setClearColor('#fbfdff');
        viewport.prepend(renderer.domElement);
        const scene = new T.Scene();
        const camera = new T.PerspectiveCamera(36, 780/HEIGHT, .1, 80);
        const surfaces = new T.Group(), slices = new T.Group(), foundation = new T.Group(), intersection = new T.Group(), projection = new T.Group();
        scene.add(foundation, surfaces, intersection, projection, slices);
        three = { T, renderer, scene, camera, surfaces, slices, foundation, intersection, projection, yaw: .67, pitch: .45, radius: 12.8, shapeKey: '', maxMoment: 1, width: 780, aero: null, structure: null, projectionLines: 0 };
        let drag = null;
        renderer.domElement.addEventListener('pointerdown', event => {
          // Fingers retain native horizontal scrolling; view buttons rotate on touch screens.
          if (event.pointerType !== 'mouse' || event.button !== 0) return;
          drag = { x: event.clientX, y: event.clientY };
          renderer.domElement.setPointerCapture(event.pointerId);
        });
        renderer.domElement.addEventListener('pointermove', event => {
          if (!drag) return;
          three.yaw -= (event.clientX - drag.x) * .008;
          three.pitch = Math.max(.12, Math.min(1.1, three.pitch + (event.clientY - drag.y) * .006));
          drag = { x: event.clientX, y: event.clientY };
          draw3D();
        });
        renderer.domElement.addEventListener('pointerup', () => { drag = null; });
        renderer.domElement.addEventListener('pointercancel', () => { drag = null; });
        return true;
      } catch (error) {
        failed3D = true;
        return false;
      }
    }

    function coords(U, theta, moment) {
      return [(U / UMAX - .5) * 6.2, moment / three.maxMoment * 2.1, theta / LIMIT * 2];
    }

    function line3D(group, points, color, width = 1, opacity = 1) {
      const T = three.T;
      const geometry = new T.BufferGeometry().setFromPoints(points.map(p => new T.Vector3(...p)));
      const material = new T.LineBasicMaterial({ color, linewidth: width, transparent: opacity < 1, opacity });
      const line = new T.Line(geometry, material);
      group.add(line);
      return line;
    }

    function dashed3D(group, points, color, opacity=.6) {
      const T=three.T;
      const geometry=new T.BufferGeometry().setFromPoints(points.map(p=>new T.Vector3(...p)));
      const material=new T.LineDashedMaterial({color,dashSize:.065,gapSize:.06,transparent:true,opacity,depthTest:false});
      const line=new T.Line(geometry,material);line.computeLineDistances();group.add(line);return line;
    }

    function thick3D(group,points,color,radius=.018,opacity=1) {
      const T=three.T;
      if(points.length<2)return;
      const curve=new T.CurvePath(),vectors=points.map(p=>new T.Vector3(...p));
      for(let i=1;i<vectors.length;i++)curve.add(new T.LineCurve3(vectors[i-1],vectors[i]));
      const geometry=new T.TubeGeometry(curve,Math.max(20,points.length*2),radius,5,false);
      group.add(new T.Mesh(geometry,new T.MeshBasicMaterial({color,transparent:opacity<1,opacity,depthTest:true})));
    }

    function buildSurfaces() {
      const s = state, t = three, T = t.T;
      const shapeKey = [s.k, s.slope, s.C0, s.rho, s.B, s.length].join('|');
      if (shapeKey === t.shapeKey) return;
      t.shapeKey = shapeKey;
      disposeGroup(t.surfaces);
      disposeGroup(t.foundation);disposeGroup(t.intersection);disposeGroup(t.projection);
      const factor = .5 * s.rho * s.B ** 2 * s.length;
      t.maxMoment = Math.max(5000, s.k * LIMIT, Math.abs(factor * UMAX ** 2 * (s.C0-s.slope*LIMIT)), Math.abs(factor * UMAX ** 2 * (s.C0+s.slope*LIMIT))) * 1.13;
      function surface(kind, color, opacity) {
        const group=new T.Group();group.name=kind;t.surfaces.add(group);t[kind]=group;
        const positions = [], indices = [];
        const nu = 48, nt = 16;
        for (let i = 0; i <= nu; i++) for (let j = 0; j <= nt; j++) {
          const U = UMAX * i / nu, theta = -LIMIT + 2 * LIMIT * j / nt;
          const M = kind === 'aero' ? factor * U ** 2 * (s.C0 + s.slope * theta) : s.k * theta;
          positions.push(...coords(U, theta, M));
        }
        for (let i = 0; i < nu; i++) for (let j = 0; j < nt; j++) {
          const a = i*(nt+1)+j, b = a+nt+1;
          indices.push(a,b,a+1,b,b+1,a+1);
        }
        const g = new T.BufferGeometry();
        g.setAttribute('position', new T.Float32BufferAttribute(positions, 3));
        g.setIndex(indices);
        const m = new T.MeshBasicMaterial({ color, transparent: true, opacity, side: T.DoubleSide, depthWrite: false });
        group.add(new T.Mesh(g,m));
        for (const U of [0,20,40,60,85]) {
          const points = [-LIMIT,LIMIT].map(theta => coords(U, theta, kind === 'aero' ? factor*U**2*(s.C0+s.slope*theta) : s.k*theta));
          line3D(group,points,color,1,.6);
        }
        for (const theta of [-LIMIT,-LIMIT/2,0,LIMIT/2,LIMIT]) {
          const points=[];
          for(let i=0;i<=48;i++) { const U=85*i/48; points.push(coords(U,theta,kind==='aero'?factor*U**2*(s.C0+s.slope*theta):s.k*theta)); }
          line3D(group,points,color,1,.6);
        }
        for(const U of [0,UMAX]) thick3D(group,[-LIMIT,LIMIT].map(theta=>coords(U,theta,kind==='aero'?factor*U**2*(s.C0+s.slope*theta):s.k*theta)),color,.012);
      }
      surface('structure',C.structure,.24);
      surface('aero',C.aero,.34);
      const floor=-t.maxMoment;
      const corners=[coords(0,-LIMIT,floor),coords(UMAX,-LIMIT,floor),coords(UMAX,LIMIT,floor),coords(0,LIMIT,floor)];
      const baseGeometry=new T.BufferGeometry().setAttribute('position',new T.Float32BufferAttribute(corners.flat(),3));baseGeometry.setIndex([0,1,2,0,2,3]);
      t.foundation.add(new T.Mesh(baseGeometry,new T.MeshBasicMaterial({color:'#e7eef5',transparent:true,opacity:.55,side:T.DoubleSide,depthWrite:false})));
      for(const U of [0,20,40,60,85]) line3D(t.foundation,[coords(U,-LIMIT,floor),coords(U,LIMIT,floor)],'#c6d4e0',1,.8);
      for(const theta of [-LIMIT,-LIMIT/2,0,LIMIT/2,LIMIT]) line3D(t.foundation,[coords(0,theta,floor),coords(UMAX,theta,floor)],'#c6d4e0',1,.8);
      thick3D(t.foundation,[...corners,corners[0]],'#9aaebb',.01);
      line3D(t.foundation,[coords(0,-LIMIT,floor),coords(0,-LIMIT,t.maxMoment)],'#8196a7');
      dashed3D(t.foundation,[coords(0,-LIMIT,0),coords(UMAX,-LIMIT,0)],'#a6b7c4',.7);
      const segments=equilibriumSegments(s);t.projectionLines=0;
      for(const segment of segments) {
        const color=C[segment.stability];
        thick3D(t.intersection,segment.points.map(p=>coords(p.U,p.theta,p.M)),color,.028);
        thick3D(t.projection,segment.points.map(p=>coords(p.U,p.theta,floor+.004*t.maxMoment)),color,.023);
        for(let i=8;i<segment.points.length;i+=13) {
          const p=segment.points[i];dashed3D(t.projection,[coords(p.U,p.theta,p.M),coords(p.U,p.theta,floor)],C.projection,.48);t.projectionLines++;
        }
      }
      if(s.zeroBias && s.criticalSpeed!==null && s.criticalSpeed<=UMAX) {
        thick3D(t.intersection,[-LIMIT,LIMIT].map(theta=>coords(s.criticalSpeed,theta,s.k*theta)),C.critical,.027);
        thick3D(t.projection,[-LIMIT,LIMIT].map(theta=>coords(s.criticalSpeed,theta,floor+.004*t.maxMoment)),C.critical,.025);
        for(const theta of [-LIMIT,-LIMIT/2,LIMIT/2,LIMIT]) {dashed3D(t.projection,[coords(s.criticalSpeed,theta,s.k*theta),coords(s.criticalSpeed,theta,floor)],C.projection,.45);t.projectionLines++;}
      }
    }

    function buildSlice() {
      const s=state,t=three,T=t.T;
      const sliceKey=[s.U,s.k,s.C0,s.slope,s.rho,s.B,s.length,s.status].join('|');
      if(t.sliceKey===sliceKey)return;
      t.sliceKey=sliceKey;
      disposeGroup(t.slices);
      const current=new T.Group(), slice=new T.Group();t.slices.add(current,slice);t.current=current;t.slice=slice;
      const points=[coords(s.U,-LIMIT,-t.maxMoment),coords(s.U,LIMIT,-t.maxMoment),coords(s.U,LIMIT,t.maxMoment),coords(s.U,-LIMIT,t.maxMoment)];
      const geometry=new T.BufferGeometry();
      geometry.setAttribute('position',new T.Float32BufferAttribute(points.flat(),3));
      geometry.setIndex([0,1,2,0,2,3]);
      slice.add(new T.Mesh(geometry,new T.MeshBasicMaterial({color:'#45918e',transparent:true,opacity:.1,side:T.DoubleSide,depthWrite:false})));
      line3D(slice,[...points,points[0]],'#73a7a3',1,.8);
      thick3D(slice,[-LIMIT,LIMIT].map(theta=>coords(s.U,theta,s.Q*(s.C0+s.slope*theta))),C.aero,.023);
      thick3D(slice,[-LIMIT,LIMIT].map(theta=>coords(s.U,theta,s.k*theta)),C.structure,.023);
      line3D(current,[coords(s.U,-LIMIT,-t.maxMoment+.008*t.maxMoment),coords(s.U,LIMIT,-t.maxMoment+.008*t.maxMoment)],'#45918e',1,.85);
      if(s.equilibrium!==null && Math.abs(s.equilibrium)<=LIMIT && s.status!=='critical') {
        const dot=new T.Mesh(new T.SphereGeometry(.068,14,10),new T.MeshBasicMaterial({color:s.status==='unstable'?C.unstable:C.stable}));
        dot.position.set(...coords(s.U,s.equilibrium,s.k*s.equilibrium));current.add(dot);
        const ground=dot.clone();ground.material=dot.material.clone();ground.geometry=dot.geometry.clone();ground.position.set(...coords(s.U,s.equilibrium,-t.maxMoment+.014*t.maxMoment));current.add(ground);
        dashed3D(current,[coords(s.U,s.equilibrium,s.k*s.equilibrium),coords(s.U,s.equilibrium,-t.maxMoment)],C.projection,.95);
      }
      if(s.continuum) thick3D(current,[-LIMIT,LIMIT].map(theta=>coords(s.U,theta,-t.maxMoment+.014*t.maxMoment)),C.critical,.032);
    }

    function applyLessonVisibility() {
      if(!three)return;

    }

    function renderBranchFallback() {
      renderMoments();viewport.hidden=true;tools.hidden=true;
      caption.innerHTML=`<strong>当前环境无法显示 WebGL：这里保留当前 U 的两条力矩直线，下图保留同一平衡集的 U–θ 投影。</strong> ${equilibriumText()} 公式步骤仍可逐项选择。`;
    }

      renderStepCopy();renderBranch();

      caption.innerHTML=`<strong>${equilibriumText()}</strong> 图中 θ 以度标示，公式求值与 a 的斜率单位使用 rad。${lessonStep===4?'青色切片对应“② 两力矩与交点”。 ':''}两曲面与投影均限于局部线性化的 ±10° 工作窗。`;
    }

    function render() {
      if(!state)return;
      svg.removeAttribute('hidden');viewport.hidden=true;tools.hidden=true;
      cmOption.hidden=view!=='cm';
      lesson.hidden=view!=='surfaces';branchPanel.hidden=view!=='surfaces';
      speedRow.hidden=view==='cm';speedInput.value=state.U;speedValue.textContent=`${fmt(state.U,2)} m/s`;
      if(view==='cm')renderCM();

      else renderSurfaces();

    function setView(name) {
      if(!['cm','moments','surfaces'].includes(name))return;
      view=name;tabs.forEach(tab=>tab.setAttribute('aria-pressed',String(tab.dataset.tpView===view)));render();
    }
    function setLessonStep(name) {
      const index=typeof name==='number'?name:STEPS.indexOf(name);
      if(!Number.isInteger(index)||index<0||index>=STEPS.length)return;
      lessonStep=index;setView('surfaces');
    }
    tabs.forEach(button=>button.addEventListener('click',()=>setView(button.dataset.tpView)));
    stepButtons.forEach(button=>button.addEventListener('click',()=>setLessonStep(button.dataset.tpStep)));
    speedInput.addEventListener('input',event=>{if(typeof options.onSpeedChange==='function')options.onSpeedChange(Number(event.target.value));});
    cmOption.querySelector('input').addEventListener('change',event=>{showIllustrativeCurve=event.target.checked;if(view==='cm')render();});
    host.querySelectorAll('[data-tp-orbit]').forEach(button=>button.addEventListener('click',()=>{
      if(!three)return;
      if(button.dataset.tpOrbit==='reset'){three.yaw=.67;three.pitch=.45;}
      else three.yaw+=button.dataset.tpOrbit==='left'?.28:-.28;
      draw3D();
    }));

    function resize() {
      if(!three||view!=='surfaces'||viewport.hidden)return;
      const width=Math.max(720,viewport.clientWidth||780);
      three.width=width;three.camera.aspect=width/HEIGHT;three.camera.updateProjectionMatrix();
      three.renderer.setSize(width,HEIGHT,false);draw3D();
    }
    if(window.ResizeObserver)new ResizeObserver(resize).observe(host);
    return {
      update(raw){state=normalize(raw);render();},resize,setView,setLessonStep,
      getState(){return {view,lessonStep:STEPS[lessonStep],lessonStepIndex:lessonStep,available3D:!!three,projectionLines:three?three.projectionLines:0,plotBounds:{U:[0,UMAX],theta:[-LIMIT,LIMIT],branchPixels:{left:74,right:746,top:36,bottom:224}},...(state?{U:state.U,equilibrium:state.equilibrium,status:state.status,zeroBias:state.zeroBias,continuum:state.continuum,noEquilibrium:state.noEquilibrium,criticalSpeed:state.criticalSpeed,branches:equilibriumSegments(state).map(({low,high,stability})=>({low,high,stability}))}:{})};}
    };
  }

  window.TorsionPlots={create};
})();

</script>

    }

    return { update(raw) { state = raw; render(); }, setStep, getState: () => ({ step, delta }) };
  }
  window.TorsionDerivation = { create };
})();

  <section class="t-logic" id="t-math" aria-label="力矩系数、局部线性化与规范公式">
   <h3>02　公式中的两项，怎样变成两个面？</h3><p class="muted" style="font-size:13px;margin-bottom:0">横向是风速 U，另一方向是转角 θ，高度是力矩 M。橙色和蓝色贯穿公式与曲面；两面在同一位置、同一高度相遇，才满足力矩平衡。</p>
   <div id="t-force-map"></div>
   <div class="t-reading"><div><small>当前模型点的力矩系数</small><br><strong id="t-cm"></strong><p id="t-cm-text"></p></div><div><small>局部斜率 a = dCₘ/dα</small><br><strong id="t-a"></strong><p id="t-a-text"></p></div></div>
   <div id="t-plots"></div>
   <div class="t-equations" id="t-derivation"><h3>03　从交点出发，一步步推导静力发散</h3>
    <div id="t-derive"></div>
    <div class="t-criterion"><div><b>kₑff &gt; 0</b>扰动净矩指向平衡点，静力稳定。</div><div><b>kₑff = 0</b>一阶恢复刚度消失，达到线性临界条件。</div><div><b>kₑff &lt; 0</b>扰动净矩继续推偏，平衡点静力不稳定。</div></div>
    <div class="explain" style="margin-top:20px"><strong>规范原式 · 7.2.3</strong><div class="formula" style="font-size:17px;margin-top:9px">U<sub>td</sub> = K<sub>td</sub> f<sub>t</sub> B<br>K<sub>td</sub> = √[(π³/2) μ(r/b)² / C′<sub>M</sub>]</div><p style="margin:10px 0 0;font-size:12px">b = B/2；μ = m/(πρb²)；r = √(Iₘ/m)。fₜ 为扭转基频，m、Iₘ 为单位桥长质量和质量惯性矩。规范用 fₜ 表征结构扭转刚度，这里仍研究平均风下的静力发散。</p><p style="margin:8px 0 0;font-size:12px">条文说明式 7-10：U<sub>td</sub> = √[2K<sub>α</sub>/(ρB²C′<sub>M0</sub>)]。对应本页 K<sub>α</sub> = k/ℓ、C′<sub>M0</sub> = a，因此 U<sub>td</sub> 与本页 U<sub>cr</sub> 相同。</p></div>
    <p class="t-standard">规范依据：<a href="https://xxgk.mot.gov.cn/jigou/glj/202006/P020230330569591490998.pdf" target="_blank" rel="noreferrer">《公路桥梁抗风设计规范》JTG/T 3360-01—2018</a>，2.1.19、7.2.3 与条文说明图 7-2、式 7-9/7-10（印刷页 59–60）。前面的增量公式统一了单位桥长与节段的记号；7.2.4 要求大跨桥进一步考虑几何与气动力非线性。</p>
    <details><summary>翻转动画与规范临界风速的关系</summary><p>三维几何可连续旋转，没有 4° 或 12° 截停。超过 ±10° 后，力矩仍按切线延续，所以标为“线性发散外推”。90°、180° 用于观察桥面翻转形状，不能据此声称实际桥梁必然翻转到该角度。</p><p>真正的大转角分析需要全角度 Cₘ(α) 与结构抗矩 R(θ)，可能出现新的平衡。规范 7.2.6 条文说明指出，考虑几何与气动力非线性后，临界风速一般为 7.2.3 线性结果的 60%–70%；不能据线性结果断言实际临界风速更高。本页不把该范围作为通用折减系数。</p></details>
   </div>
  </section>`;
  const $=s=>host.querySelector(s);
  const bridge=window.TorsionBridge3D.create($('#t-bridge'),{width:p.B,length:400,angle:p.theta,view:'section',showAngleLabel:false,showWindLabel:false,showEquilibriumLabel:false,

  function geometryLabel(){

  function draw(updateControls=true){
   const f=P.evaluate(p),out=Math.abs(p.theta)>P.rad(10);

   bridge.setEquilibrium(f.status==='stable'?f.equilibrium:null,{stable:true,visible:f.status==='stable'});
   if(updateControls)controls();
   $('#t-angle').textContent=F(P.deg(p.theta),1)+'°';if(document.activeElement!==$('#t-angle-input'))$('#t-angle-input').value=F(P.deg(p.theta),1);
   $('#t-angle-label').textContent=out?'跨中外推角 θ':'跨中扭转角 θ';$('#t-geometry').textContent=geometryLabel();$('#t-extrapolation').hidden=!out;
   $('#t-badge').className='pill '+f.status;$('#t-badge').textContent={stable:'静力稳定',critical:'一阶刚度为零',unstable:'静力不稳定'}[f.status];
   [['ma',f.moment],['mr',f.restoring],['net',f.net]].forEach(([key,v])=>{$('#t-'+key).textContent=F(v/1000,2)+' kN·m';$('#t-'+key+'-dir').textContent=dir(v);});
   $('#t-effective').textContent=F(f.effective/1000,2)+' kN·m/rad';$('#t-effective').style.color=f.status==='unstable'?'var(--red)':f.status==='stable'?'var(--green)':'#996000';
   $('#t-critical').textContent=f.criticalSpeed===null?'a ≤ 0：本模型无正的发散临界风速':'线性临界风速 Ucr = '+F(f.criticalSpeed,2)+' m/s';
   $('#t-cross-critical').disabled=f.criticalSpeed===null||f.criticalSpeed*1.02>85;
   const stable=f.status==='stable',gap=stable?p.theta-f.equilibrium:null;
   $('#t-target-label').textContent=stable?'此风速的稳定平衡角 θₑ':'此风速有稳定平衡吗？';
   $('#t-target-angle').textContent=stable?F(P.deg(f.equilibrium),2)+'°':f.continuum?'一阶中性平衡':'无稳定平衡';
   $('#t-target-note').textContent=stable?(Math.abs(f.equilibrium)>P.rad(10)?'该代数角在图窗外，属于线性外推。':'绿色参照位置随风速改变。') :f.noEquilibrium?'临界且常量风矩不为零，无有限平衡。':f.continuum?'一阶恢复力为零，不会自动回归。':'代数交点不稳定，轻推后继续远离。';
   $('#t-target-angle').style.color=stable?'var(--green)':f.status==='unstable'?'var(--red)':'#996000';
   $('#t-distance').textContent=gap===null?'—':(gap>0?'+':'')+F(P.deg(gap),2)+'°';
   $('#t-motion-status').textContent=dragging?'手动扭偏中；松手再判断':stable?(running?'正在靠近新的稳定平衡位置':Math.abs(gap)<P.rad(.002)?'已稳住；扭偏后仍会回到这里':'松手后回到此风速的平衡角'):f.status==='unstable'?(running?'风速不再变，偏转仍继续增大':'松手后不会自动回到交点'):f.continuum?'没有一阶恢复力，停在哪里就在哪里':running?'固定风速下继续偏转':'此时无有限平衡位置';
   const root=f.equilibrium===null?(f.noEquilibrium?'常量风矩不为零，此一阶模型无有限平衡。':'常量风矩为零，此一阶模型呈中性平衡。'):'代数平衡角 θₑ = '+F(P.deg(f.equilibrium),2)+'°'+(f.status==='unstable'?'，这个交点不稳定。':'。');
   const behavior=f.status==='stable'?'松手会回到当前风速的稳定平衡角，不一定回到水平。':f.status==='critical'?'气动增量刚度抵消结构刚度，一阶恢复能力消失。':'在这个固定风速下，偏离不稳定交点后仍会继续远离；角度不会自动截停。';
   $('#t-feedback').textContent=(notice?notice+' ':'')+behavior+' '+root;
   $('#t-cm').textContent='Cₘ = '+F(f.cm,4);$('#t-a').textContent='a = '+F(p.slope,3)+' /rad';
   $('#t-cm-text').textContent=(out?'外推模型中，':'此角度下，')+(Math.abs(f.moment)<1e-8?'平均风力矩为零。':'平均风力矩为'+dir(f.moment)+'。')+'Cₘ 为负不等于稳定；在有风时，它的符号表示当前气动力矩方向。';
   $('#t-a-text').textContent=p.slope>0?'正斜率：正向转一点，风的正向力矩增加，削弱有效刚度；Qa ≥ k 时才到达或越过临界。':p.slope<0?'负斜率：正向转一点，风力矩增量指向负向，增强本模型的恢复能力。':'零斜率：风力矩不随小转角改变；Cₘ₀ 可造成静偏转，但不产生气动增量刚度。';
   plots.update({...p,...f});
   derivation.update({...p,...f});
  }
  function tick(now){
   if(!running)return;const ds=Math.min(.06,(now-previous)/1000);previous=now;
   p.theta=P.trendStep(p,p.theta,ds,speed*presentationGain());bridge.setAngle(p.theta);
   if(now-lastUI>100){draw(false);lastUI=now;}
   const f=P.evaluate(p);
   if(f.status==='stable'&&Math.abs(p.theta-f.equilibrium)<P.rad(.002)){p.theta=f.equilibrium;pause();notice='已稳在 U = '+F(p.U,2)+' m/s 对应的平衡位置。';draw();return;}
   if(f.status!=='stable'&&Math.abs(f.net)<1e-8){pause();notice=f.continuum?'一阶中性平衡：松手后没有恢复力。':'恰好位于不稳定交点；轻推一点，再松手观察。';draw();return;}
   frame=requestAnimationFrame(tick);
  }
  // The gain controls teaching progress, never the equilibrium or moment equation.
  // Near-zero stiffness must remain observable without pretending this is physical time.
  function presentationGain(){return Math.min(12,1/Math.max(Math.abs(P.evaluate(p).effective/p.k),.08));}
  function start(){if(running)return;running=true;previous=performance.now();lastUI=0;$('#t-release').textContent='暂停观察';draw();frame=requestAnimationFrame(tick);}
  function release(){if(running){pause();draw(false);return;}notice='已松手：风速保持不变。';start();}
  function set(values){pause();notice='';Object.assign(p,values);draw();}
  function changeWind(U){pause();p.U=Math.max(0,Math.min(85,Number(U)));notice='已调到 '+F(p.U,2)+' m/s：保留刚才的转角，观察会稳在哪里。';draw();start();}
  function changeAndRelease(values,message='参数已改变；保持当前转角后松手。'){set(values);notice=message;start();}
  function chooseExperiment(name){
   experiment=name==='threshold'?'threshold':'follow';
   const s={...p,k:115200,slope:.12,C0:experiment==='threshold'?.001:.004};
   s.U=experiment==='threshold'?P.evaluate(s).criticalSpeed*.95:30;s.theta=P.evaluate(s).equilibrium;
   set(s);
   $('#t-experiment-hint').textContent=experiment==='threshold'?'现在在临界前的稳定位置。先手动扭偏再松手；然后点“略增风速，越过临界”，看固定风速下偏转继续增大。':'先按 20、30、40 m/s 比较。再把桥面扭偏，松手后回到的是当前风速的平衡角。';
   notice=experiment==='threshold'?'已放在临界前的稳定平衡位置；此时手动扭偏仍能回归。':'已放在 30 m/s 的稳定平衡位置。调大风速，桥面会逐渐转到新的平衡角。';draw();
  }
  function preset(name){
   const s={...p,k:115200,slope:.12,C0:name==='stable'?.004:0,theta:P.rad(2)};
   const uc=P.evaluate(s).criticalSpeed;s.U=uc*({stable:.67,critical:1,unstable:1.15}[name]);changeAndRelease(s,'已切换状态，松手观察能否回到平衡。');
  }
  function probe(sign){pause();p.theta+=sign*P.rad(2);notice='已扭偏 '+(sign>0?'+':'−')+'2° 并松手。';start();}
  ['#t-speed','#t-live-speed'].forEach(id=>$(id).addEventListener('input',e=>changeWind(Number(e.target.value))));
  [['#t-stiffness','k',1000],['#t-slope','slope',1],['#t-offset','C0',1]].forEach(([id,key,m])=>$(id).addEventListener('input',e=>changeAndRelease({[key]:Number(e.target.value)*m})));
  $('#t-release').addEventListener('click',release);$('#t-zero').addEventListener('click',()=>changeAndRelease({theta:0},'从水平位置松手，观察会转到哪个平衡角。'));
  $('#t-minus').addEventListener('click',()=>probe(-1));$('#t-plus').addEventListener('click',()=>probe(1));
  $('#t-reset').addEventListener('click',()=>{const f=P.evaluate(p);if(f.equilibrium===null){pause();notice='此时没有唯一有限平衡角。';draw();}else set({theta:f.equilibrium});});
  $('#t-offset-zero').addEventListener('click',()=>changeAndRelease({C0:0,theta:0},'零偏置模型：先轻推一点，再看是否回到水平。'));
  $('#t-speedup').addEventListener('click',()=>{speed=speed===1?2:speed===2?4:1;$('#t-speedup').textContent='演示速度 ×'+speed;});
  $('#t-angle-input').addEventListener('focus',()=>{pause();draw(false);});
  $('#t-angle-input').addEventListener('change',e=>{const v=Number(e.target.value);if(Number.isFinite(v))changeAndRelease({theta:P.rad(v)},'已手动扭到 '+F(v,1)+'° 后松手。');});
  host.querySelectorAll('[data-t-angle]').forEach(b=>b.addEventListener('click',()=>set({theta:P.rad(Number(b.dataset.tAngle))})));
  host.querySelectorAll('[data-t-preset]').forEach(b=>b.addEventListener('click',()=>preset(b.dataset.tPreset)));
  host.querySelectorAll('[data-t-case]').forEach(b=>b.addEventListener('click',()=>changeAndRelease({C0:b.dataset.tCase[0]==='p'?.004:-.004,slope:b.dataset.tCase[1]==='p'?.12:-.12,theta:0})));
  host.querySelectorAll('[data-t-slope]').forEach(b=>b.addEventListener('click',()=>changeAndRelease({slope:Number(b.dataset.tSlope)})));
  host.querySelectorAll('[data-t-experiment]').forEach(b=>b.addEventListener('click',()=>chooseExperiment(b.dataset.tExperiment)));
  host.querySelectorAll('[data-t-wind]').forEach(b=>b.addEventListener('click',()=>changeWind(Number(b.dataset.tWind))));
  $('#t-cross-critical').addEventListener('click',()=>{const f=P.evaluate(p);if(f.criticalSpeed!==null&&f.criticalSpeed*1.02<=85){changeWind(f.criticalSpeed*1.02);notice='已增到临界风速的 1.02 倍；风速停在这里，继续看桥面是否还在转。';draw(false);}});
  host.querySelectorAll('[data-t-interaction]').forEach(b=>b.addEventListener('click',()=>{interactionMode=b.dataset.tInteraction;bridge.setInteractionMode(interactionMode);host.querySelectorAll('[data-t-interaction]').forEach(c=>c.setAttribute('aria-pressed',String(c===b)));$('#t-drag-hint').textContent=interactionMode==='twist'?'上下拖动扭偏，松手自动观察':'拖动只转视角，不改变桥面转角';}));
  host.querySelectorAll('[data-t-camera]').forEach(b=>b.addEventListener('click',()=>{bridge.setView(b.dataset.tCamera);host.querySelectorAll('[data-t-camera]').forEach(c=>c.setAttribute('aria-pressed',String(b===c)));}));
  $('#t-to-math').addEventListener('click',e=>{e.preventDefault();$('#t-math').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});});
  function scrollTo(target){pause();$(target).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});}
  $('#t-to-bridge').addEventListener('click',()=>scrollTo('.t-stage'));
  $('#t-to-geometry').addEventListener('click',()=>{plots.setLessonStep('projection');scrollTo('#t-math');});
  $('#t-to-derivation').addEventListener('click',()=>scrollTo('#t-derivation'));
  const api={pause,release,start,preset,set,probe,changeWind,chooseExperiment,plots,derivation,resize:()=>{bridge.resize();plots.resize();},getState:()=>({...p,...P.evaluate(p),running,speed,dragging,interactionMode,experiment,presentationGain:presentationGain(),bridge:bridge.getState(),plots:plots.getState?.(),derivation:derivation.getState()}),step(ds){pause();p.theta=P.trendStep(p,p.theta,ds,speed*presentationGain());draw();}};
  window.TorsionDemo=api;draw();return api;
 }
 window.TorsionLab={mount};
})();

</script>
<script>
/* app.js */
(function(){
  'use strict';
  const meta = {
    torsion:['Mean wind · Static torsional divergence','调大风速会稳住，还是会一直转下去？','调风速，看桥面逐步转到新的平衡位置；手动扭偏再松手，看它回到此风速的平衡角，还是在固定风速下继续发散。再用曲面交线与局部线性化解释原因。'],
    flow:['Mean wind & reference axes','同一股风，换个坐标怎么看？','转动平均风的方向与桥面角度，看风速分量、风攻角，以及风轴与体轴下的同一组力。'],
    sections:['Section aerodynamics','截面变了，三分力怎么变？','把截面、受力箭头与系数放在同一张图里。区分几何示意、原始时程比较与攻角数据。'],
    loads:['Mean wind loading','越往高处，风荷载增大多少？','沿塔高取一条受风条带，对照风速、平均荷载与等效静力荷载，理解风速平方带来的变化。']
  };
  const instances={};let active=null;
  function show(name){
    if(!meta[name]) name='torsion';
    if(active && instances[active]?.pause) instances[active].pause();
    document.querySelectorAll('[data-module]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.module===name)));
    Object.keys(meta).forEach(key=>document.getElementById('panel-'+key).hidden=key!==name);
    const [kicker,title,description]=meta[name];
    document.getElementById('module-kicker').textContent=kicker;
    document.getElementById('module-title').textContent=title;
    document.getElementById('module-description').textContent=description;
    if(!instances[name]){
      const api=window[{torsion:'TorsionLab',flow:'FlowLab',sections:'SectionsLab',loads:'LoadsLab'}[name]];
      if(!api)throw new Error('教学模块未加载：'+name);
      instances[name]=api.mount(document.getElementById('panel-'+name));
    }
    instances[name]?.resize?.();active=name;
    history.replaceState(null,'','#'+name);
  }
  document.querySelectorAll('[data-module]').forEach(button=>button.addEventListener('click',()=>show(button.dataset.module)));
  document.querySelector('.nav').addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
    const buttons=[...document.querySelectorAll('[data-module]')],index=buttons.indexOf(document.activeElement);
    if(index<0)return;event.preventDefault();
    const next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+(event.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;
    buttons[next].focus();show(buttons[next].dataset.module);
  });
  document.getElementById('fullscreen').addEventListener('click',async()=>{
    const button=document.getElementById('fullscreen');
    try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}
    catch{button.textContent='请按 F11 放大';}
  });
  document.addEventListener('fullscreenchange',()=>document.getElementById('fullscreen').textContent=document.fullscreenElement?'退出全屏':'放大课堂画面');
  window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
  window.addEventListener('resize',()=>instances[active]?.resize?.());
  document.addEventListener('visibilitychange',()=>{if(document.hidden)instances[active]?.pause?.();});
  window.StaticWindApp={show,getActive:()=>active};
  show(location.hash.slice(1)||'torsion');
})();

</script>
</body>
